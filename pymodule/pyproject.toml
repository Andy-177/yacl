[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yacl"
version = "1.0.0"
description = "Yet Another Config Language: a lightweight, human-readable configuration language"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "YACL Contributors" }]
keywords = ["yacl", "config", "configuration", "serialization", "human-readable"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/yacl/yacl"

[tool.setuptools]
packages = ["yacl"]